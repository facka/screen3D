<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen3D — Panel semicircular 3D</title>
<style>
    :root {
        --neon-cyan: #00ffe5;
        --neon-pink: #ff2fd6;
        --neon-purple: #8b5cf6;
        --neon-blue: #2fa8ff;
        --bg: #05040a;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: var(--bg); color: #eef2ff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    #three-canvas { position: fixed; inset: 0; display: block; z-index: 0; }

    #css3d-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    #css3d-container .css3d-object * { pointer-events: auto; }

    #hud {
        position: fixed; top: 15px; left: 15px; z-index: 10;
        color: var(--neon-cyan); background: rgba(5, 5, 15, 0.8);
        padding: 10px 14px; border-radius: 8px; border: 1px solid var(--neon-cyan);
        font-size: 11px; line-height: 1.5; box-shadow: 0 0 15px rgba(0, 255, 220, 0.2);
        max-width: 230px;
    }
    #webcam {
        position: fixed; top: 15px; right: 15px; z-index: 10;
        width: 130px; height: 98px; transform: scaleX(-1);
        border: 2px solid var(--neon-cyan); border-radius: 6px; opacity: 0.85;
    }
    #cam-permission {
        position: fixed; bottom: 18px; right: 18px; z-index: 10;
        background: rgba(5,5,15,0.85); border: 1px solid var(--neon-pink); color: var(--neon-pink);
        padding: 10px 14px; border-radius: 8px; font-size: 12px; cursor: pointer;
        box-shadow: 0 0 12px rgba(255,47,214,0.3); display: none;
    }
    #brand {
        position: fixed; bottom: 15px; left: 15px; z-index: 10;
        font-weight: 800; letter-spacing: 2px; font-size: 14px; color: #fff;
        text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    }

    .box {
        background: rgba(10, 9, 20, 0.65);
        border: 1px solid rgba(0, 255, 229, 0.3);
        border-radius: 18px;
        backdrop-filter: blur(4px);
        box-shadow: 0 0 30px rgba(0, 255, 229, 0.12);
    }

    .box-hero { width: 720px; padding: 42px 50px; text-align: center; border-color: rgba(0,255,229,0.45); }
    .badge {
        display: inline-block; padding: 7px 20px; border-radius: 24px;
        border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
        font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
        margin-bottom: 20px; box-shadow: 0 0 14px rgba(0,255,229,0.35);
    }
    .glow-title {
        font-size: 54px; font-weight: 900; margin: 0 0 14px; line-height: 1.08;
        background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink) 50%, var(--neon-purple));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 0 50px rgba(0, 255, 229, 0.4);
    }
    .subtitle { font-size: 17px; color: #c9d3f5; line-height: 1.55; margin: 0 0 24px; }
    .btn {
        text-decoration: none; padding: 14px 30px; border-radius: 10px; font-weight: 700;
        font-size: 15px; display: inline-block; transition: transform 0.2s;
        color: #05040a; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
        box-shadow: 0 0 26px rgba(0,255,229,0.55);
    }
    .btn:hover { transform: translateY(-3px); }

    .box-feature { width: 300px; padding: 24px 24px; }
    .box-feature .icon { font-size: 28px; margin-bottom: 10px; filter: drop-shadow(0 0 8px currentColor); }
    .box-feature h3 { margin: 0 0 8px; font-size: 17px; color: #fff; }
    .box-feature p { margin: 0; color: #a9b2d6; font-size: 13px; line-height: 1.5; }

    .box-steps { width: 320px; padding: 22px 26px; border-color: rgba(139,92,246,0.4); }
    .box-steps h4 { margin: 0 0 12px; color: #fff; font-size: 16px; text-align: center; text-shadow: 0 0 14px rgba(139,92,246,0.5); }
    .box-steps ol { margin: 0; padding-left: 18px; color: #a9b2d6; font-size: 12.5px; line-height: 1.75; }
    .box-steps ol li strong { color: #fff; }

    .box-cta {
        width: 300px; padding: 20px 26px; text-align: center; border-color: rgba(255,47,214,0.5);
        box-shadow: 0 0 30px rgba(255,47,214,0.2);
    }
    .box-cta p { margin: 0 0 14px; font-size: 14px; color: #f0c9ea; }
    .btn-pink {
        text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: 700; font-size: 14px;
        color: var(--neon-pink); border: 1px solid var(--neon-pink); background: rgba(255,47,214,0.08);
        box-shadow: 0 0 18px rgba(255,47,214,0.3); display: inline-block;
    }
</style>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="brand">⌬ SCREEN3D</div>
    <div id="hud">
        <strong>PANTALLA SEMICIRCULAR</strong><br>
        Gira la cabeza a un lado (sin inclinar) para revelar el contenido fuera de pantalla.
        Acércate o aléjate para el efecto de profundidad.
    </div>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="cam-permission" onclick="requestCamera()">⚠ Activar cámara para el efecto de profundidad facial</div>

    <canvas id="three-canvas"></canvas>
    <div id="css3d-container"></div>

    <!-- Cajas dispuestas en arco (semicírculo), todas a la misma distancia (profundidad) del centro -->
    <template id="tpl-hero">
        <div class="box box-hero">
            <div class="badge">Realidad aumentada · Sin gafas · Sin sensores</div>
            <h1 class="glow-title">Tu pantalla es<br>una ventana al espacio</h1>
            <p class="subtitle">Gira la cabeza para rotar el panel a tu alrededor y descubrir lo que queda fuera de encuadre.</p>
            <a class="btn" href="index.html">▶ Probar la demo 6-DOF</a>
        </div>
    </template>

    <template id="tpl-f1">
        <div class="box box-feature"><div class="icon" style="color: var(--neon-cyan);">👁</div><h3>Face tracking 6-DOF</h3><p>Detecta posición y distancia de tu cabeza con MediaPipe Face Mesh.</p></div>
    </template>
    <template id="tpl-f2">
        <div class="box box-feature"><div class="icon" style="color: var(--neon-pink);">🔄</div><h3>Panel giratorio</h3><p>El arco de contenido rota en sentido inverso a tu giro de cabeza, como un carrusel.</p></div>
    </template>
    <template id="tpl-f3">
        <div class="box box-feature"><div class="icon" style="color: var(--neon-purple);">✨</div><h3>Suavizado inteligente</h3><p>Interpolación (lerp) que elimina temblores y ruido para un movimiento fluido.</p></div>
    </template>
    <template id="tpl-f4">
        <div class="box box-feature"><div class="icon" style="color: var(--neon-blue);">🔍</div><h3>Zoom por proximidad</h3><p>Acercarte o alejarte de la cámara controla la profundidad de la escena.</p></div>
    </template>

    <template id="tpl-steps">
        <div class="box box-steps">
            <h4>CÓMO FUNCIONA</h4>
            <ol>
                <li><strong>Captura facial:</strong> MediaPipe localiza los puntos de referencia de tu rostro.</li>
                <li><strong>Yaw → rotación del panel:</strong> girar la cabeza rota el arco en sentido opuesto.</li>
                <li><strong>Distancia → zoom:</strong> acercarte o alejarte mueve la cámara en profundidad.</li>
            </ol>
        </div>
    </template>

    <template id="tpl-cta">
        <div class="box box-cta">
            <p>Listo para ver profundidad donde no la hay.</p>
            <a class="btn-pink" href="index.html">▶ Lanzar experiencia 3D</a>
        </div>
    </template>

<script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

    const videoElement = document.getElementById('webcam');
    const canvas3D = document.getElementById('three-canvas');

    // Objetivos de la IA (Target)
    let targetX = 0, targetY = 0, targetZ = 3;
    let targetYaw = 0;

    // Valores interpolados actuales (Current)
    let currentX = 0, currentY = 0, currentZ = 3;
    let currentYaw = 0;

    const SUAVIZADO = 0.10;
    const RING_YAW_SENSITIVITY = 2.6; // amplifica el giro de cabeza para revelar el arco
    const RING_YAW_LIMIT = 1.15; // ~66°, evita que el arco gire más de lo que hay contenido

    // Todas las cajas están al mismo radio (misma profundidad), sólo cambia su ángulo en el arco
    const RADIUS = 9;
    const BOXES = [
        { tpl: 'tpl-hero',  angle: 0,   y: 0.4  },
        { tpl: 'tpl-f1',    angle: -22, y: 1.6  },
        { tpl: 'tpl-f2',    angle: 22,  y: 1.6  },
        { tpl: 'tpl-f3',    angle: -44, y: -0.4 },
        { tpl: 'tpl-f4',    angle: 44,  y: -0.4 },
        { tpl: 'tpl-steps', angle: -64, y: 0.6  },
        { tpl: 'tpl-cta',   angle: 64,  y: 0.6  }
    ];
    const CONTENT_SCALE = 0.012;

    let scene, camera, renderer, css3dScene, css3dRenderer, ringGroup;

    function init3D() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05040a, 0.03);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 0, 3);

        renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        css3dScene = new THREE.Scene();
        css3dRenderer = new CSS3DRenderer();
        css3dRenderer.setSize(window.innerWidth, window.innerHeight);
        css3dRenderer.domElement.style.position = 'absolute';
        css3dRenderer.domElement.style.top = '0';
        css3dRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('css3d-container').appendChild(css3dRenderer.domElement);

        ringGroup = new THREE.Group();
        css3dScene.add(ringGroup);

        buildNeonRoom();
        buildStarfield();
        buildArcBoxes();

        window.addEventListener('resize', onWindowResize, false);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('wheel', onWheelFallback, { passive: true });
    }

    function buildNeonRoom() {
        const roomGeo = new THREE.CylinderGeometry(14, 14, 14, 32, 1, true);
        const roomMat = new THREE.MeshBasicMaterial({ color: 0x0a0c16, side: THREE.BackSide });
        scene.add(new THREE.Mesh(roomGeo, roomMat));

        const grid = new THREE.GridHelper(24, 24, 0x00ffe5, 0x00ffe5);
        grid.material.transparent = true;
        grid.material.opacity = 0.13;
        grid.position.y = -6.5;
        scene.add(grid);

        // Arco de guía neón que marca visualmente el semicírculo del panel
        const guideGeo = new THREE.RingGeometry(RADIUS - 0.04, RADIUS, 64, 1, -Math.PI * 0.42, Math.PI * 0.84);
        const guideMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
        const guide = new THREE.Mesh(guideGeo, guideMat);
        guide.rotation.x = Math.PI / 2;
        guide.position.y = -3.5;
        scene.add(guide);
    }

    function buildStarfield() {
        const count = 500;
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 24;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 14;
            positions[i * 3 + 2] = -Math.random() * 16 - 4;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.09, transparent: true, opacity: 0.6 });
        scene.add(new THREE.Points(geo, mat));
    }

    // Cada caja se ubica en el arco al mismo radio y se orienta para mirar hacia el centro
    function buildArcBoxes() {
        BOXES.forEach(box => {
            const tpl = document.getElementById(box.tpl);
            const el = tpl.content.firstElementChild.cloneNode(true);
            el.classList.add('css3d-object');
            const obj = new CSS3DObject(el);

            const theta = box.angle * (Math.PI / 180);
            obj.position.set(RADIUS * Math.sin(theta), box.y, -RADIUS * Math.cos(theta));
            obj.rotation.y = -theta;
            obj.scale.set(CONTENT_SCALE, CONTENT_SCALE, CONTENT_SCALE);

            ringGroup.add(obj);
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        css3dRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Fallback sin webcam: el ratón simula el giro de cabeza; la rueda simula acercarse/alejarse
    let usingFaceTracking = false;
    function onMouseMove(e) {
        if (usingFaceTracking) return;
        targetYaw = ((e.clientX / window.innerWidth) - 0.5) * 0.5;
        targetY = -((e.clientY / window.innerHeight) - 0.5) * 1.5;
    }
    function onWheelFallback(e) {
        if (usingFaceTracking) return;
        targetZ = Math.max(1.5, Math.min(4.5, targetZ + e.deltaY * 0.003));
    }

    // CÁLCULO CON MEDIAPIPE FACE MESH: sólo posición y yaw, sin pitch/roll (evita el mareo del giro de mirada)
    function onResults(results) {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
        usingFaceTracking = true;
        document.getElementById('cam-permission').style.display = 'none';

        const landmarks = results.multiFaceLandmarks[0];
        const nariz = landmarks[4];
        const ojoIzq = landmarks[33];
        const ojoDer = landmarks[263];

        targetX = -((nariz.x - 0.5) * 3.0);
        targetY = -((nariz.y - 0.5) * 2.2);

        const anchoOjos = Math.hypot(ojoDer.x - ojoIzq.x, ojoDer.y - ojoIzq.y);
        targetZ = 1.5 + (1.0 / (anchoOjos * 3.5));

        const distIzq = Math.hypot(nariz.x - ojoIzq.x, nariz.y - ojoIzq.y);
        const distDer = Math.hypot(nariz.x - ojoDer.x, nariz.y - ojoDer.y);
        targetYaw = (distIzq - distDer) * 2.8;
    }

    function animate() {
        requestAnimationFrame(animate);

        currentX += (targetX - currentX) * SUAVIZADO;
        currentY += (targetY - currentY) * SUAVIZADO;
        currentZ += (targetZ - currentZ) * SUAVIZADO;
        currentYaw += (targetYaw - currentYaw) * SUAVIZADO;

        // La cámara sólo se traslada (nunca rota), evitando la sensación incómoda de "mirada perdida"
        camera.position.x = currentX;
        camera.position.y = currentY;
        camera.position.z = currentZ;
        camera.lookAt(camera.position.x, camera.position.y, camera.position.z - 5);

        // El giro de cabeza rota el panel en sentido inverso, revelando el contenido fuera de encuadre
        const ringYaw = Math.max(-RING_YAW_LIMIT, Math.min(RING_YAW_LIMIT, -currentYaw * RING_YAW_SENSITIVITY));
        ringGroup.rotation.y = ringYaw;

        renderer.render(scene, camera);
        css3dRenderer.render(css3dScene, camera);
    }

    // Configuración e Inicialización de MediaPipe FaceMesh
    const faceMesh = new window.FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({
        maxNumFaces: 1, refineLandmarks: false,
        minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
    });
    faceMesh.onResults(onResults);

    let cameraUtils = null;
    function requestCamera() {
        cameraUtils = new window.Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start().catch(() => {
            document.getElementById('cam-permission').style.display = 'block';
        });
    }
    window.requestCamera = requestCamera;

    window.onload = () => {
        init3D();
        animate();
        requestCamera();
        setTimeout(() => {
            if (!usingFaceTracking) document.getElementById('cam-permission').style.display = 'block';
        }, 4000);
    };
</script>
</body>
</html>
